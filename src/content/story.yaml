schemaVersion: 2
contentVersion: '0.2.0'
chapters:
  - { id: chapter_intro, label: 覚醒 }
  - { id: chapter_power_route, label: 非常電源経路 }
  - { id: chapter_carrier_sync, label: 搬送波同期 }
  - { id: chapter_maintenance_lock, label: 保守ロッカー }
  - { id: chapter_log_pairing, label: 通信ログ照合 }
  - { id: chapter_signal_route, label: 通信経路追跡 }
  - { id: chapter_packet_repair, label: PACKET復元 }
  - { id: chapter_temporal_anomaly, label: 時系列矛盾 }
  - { id: chapter_voiceprint, label: 声紋校正 }
  - { id: chapter_causal_script, label: 因果会話 }
  - { id: chapter_transmission, label: 最終送信設計 }
  - { id: chapter_ending, label: 脱出 }
locations:
  - { id: location_north_wall, label: 北壁 }
  - { id: location_east_wall, label: 東壁 }
  - { id: location_south_wall, label: 南壁 }
  - { id: location_west_wall, label: 西壁 }
hotspots:
  - {
      id: hotspot_door,
      locationId: location_north_wall,
      label: 鉄製ドア,
      conditions: [],
    }
  - {
      id: hotspot_clock,
      locationId: location_north_wall,
      label: アナログ時計,
      conditions: [],
    }
  - {
      id: hotspot_intercom,
      locationId: location_north_wall,
      label: インターホン,
      conditions: [],
    }
  - id: hotspot_terminal
    locationId: location_east_wall
    label: 壁面端末
    conditions: [{ type: puzzleSolved, puzzleId: puzzle_power_route }]
  - id: hotspot_analysis_panel
    locationId: location_east_wall
    label: 解析パネル
    conditions: [{ type: itemOwned, itemId: item_screwdriver }]
  - {
      id: hotspot_desk,
      locationId: location_south_wall,
      label: デスク,
      conditions: [],
    }
  - {
      id: hotspot_breaker,
      locationId: location_west_wall,
      label: ブレーカー,
      conditions: [],
    }
  - {
      id: hotspot_locker,
      locationId: location_west_wall,
      label: 保守ロッカー,
      conditions: [],
    }
items:
  - { id: item_screwdriver, label: ドライバー }
  - { id: item_staff_card, label: 職員用カード }
  - { id: item_floor_map, label: 設備・配線図 }
documents:
  - {
      id: document_power_plan,
      title: EMERGENCY BYPASS PLAN,
      body: 容量7 UNIT。ドア駆動線は短絡。BUFFERは最後に接続する。,
    }
  - {
      id: document_maintenance_order,
      title: MAINTENANCE ORDER,
      body: 点検順を回路銘板の記号へ変換する。,
    }
  - {
      id: document_conduit_map,
      title: FACILITY CONDUIT MAP,
      body: E-01の通信実線は環端子J-2を経てECHO BUFFER RETURNへ続く。,
    }
dialogues:
  - {
      id: dialogue_packet_01,
      speaker: future_protagonist,
      text: '……聞こえるか？',
    }
  - {
      id: dialogue_packet_02,
      speaker: future_protagonist,
      text: まず電源を戻せ。,
    }
  - {
      id: dialogue_packet_03,
      speaker: future_protagonist,
      text: ログは気にするな。,
    }
  - {
      id: dialogue_packet_04,
      speaker: future_protagonist,
      text: 最後に、赤いボタンを押せ。,
    }
  - {
      id: dialogue_no_room_question,
      speaker: protagonist,
      text: 隣の部屋なんてない。回線はこの部屋へ戻っている。,
    }
  - {
      id: dialogue_no_room_answer,
      speaker: future_protagonist,
      text: 分かってる。まだ説明できない。,
    }
  - {
      id: dialogue_identity_question,
      speaker: protagonist,
      text: この特徴量は俺の記録と同じだ。,
    }
  - {
      id: dialogue_identity_answer,
      speaker: future_protagonist,
      text: 20分後のお前だ。,
    }
puzzles:
  - id: puzzle_power_route
    kind: routing
    correctAnswer: [door, terminal, intercom, buffer]
    incorrectFeedback: 容量、短絡痕、起動条件をすべて満たす必要がある。
    effects: [{ type: unlockTerminal, menuId: system }]
    hintIds: [hint_power_1, hint_power_2, hint_power_3]
  - id: puzzle_carrier_sync
    kind: calibration
    correctAnswer: [right-2, none, left-1]
    incorrectFeedback: 早い波形と遅い波形では補正方向が逆になる。
    effects: [{ type: advanceChapter, chapterId: chapter_maintenance_lock }]
    hintIds: [hint_carrier_1, hint_carrier_2, hint_carrier_3]
  - id: puzzle_maintenance_lock
    kind: correlation
    correctAnswer: [double, ring, triangle, node]
    incorrectFeedback: 点検対象を回路銘板の記号へ置き換える。
    effects:
      - { type: grantItem, itemId: item_screwdriver }
      - { type: grantItem, itemId: item_staff_card }
      - { type: grantItem, itemId: item_floor_map }
    hintIds: [hint_lock_1, hint_lock_2, hint_lock_3]
  - id: puzzle_log_pairing
    kind: correlation
    correctAnswer: [s-b, s-c, s-a]
    incorrectFeedback: 三節すべてが同じ波形指紋を探す。
    effects: [{ type: advanceChapter, chapterId: chapter_signal_route }]
    hintIds: [hint_log_1, hint_log_2, hint_log_3]
  - id: puzzle_signal_route
    kind: routing
    correctAnswer: [signal, ring-relay, echo-buffer]
    incorrectFeedback: 線種と端子記号の両方を維持する。
    effects: [{ type: advanceChapter, chapterId: chapter_packet_repair }]
    hintIds: [hint_route_1, hint_route_2, hint_route_3]
  - id: puzzle_packet_repair
    kind: reconstruction
    correctAnswer: [c, d, a, b]
    incorrectFeedback: 先頭、終端、断片間の接続を確認する。
    effects: [{ type: advanceChapter, chapterId: chapter_temporal_anomaly }]
    hintIds: [hint_repair_1, hint_repair_2, hint_repair_3]
  - id: puzzle_temporal_anomaly
    kind: correlation
    correctAnswer: [packet-04, unseen-event]
    incorrectFeedback: 既発生と未発生の出来事を分ける。
    effects: [{ type: advanceChapter, chapterId: chapter_voiceprint }]
    hintIds: [hint_anomaly_1, hint_anomaly_2, hint_anomaly_3]
  - id: puzzle_voiceprint_calibration
    kind: calibration
    correctAnswer: [compress-half, invert, left-2]
    incorrectFeedback: 三チャンネルを個別に基準へ戻す。
    effects: [{ type: advanceChapter, chapterId: chapter_causal_script }]
    hintIds: [hint_voice_1, hint_voice_2, hint_voice_3]
  - id: puzzle_causal_script
    kind: reconstruction
    correctAnswer: [packet-01, packet-02, packet-03, packet-04]
    incorrectFeedback: 発言可能になる設備状態を確認する。
    effects: [{ type: advanceChapter, chapterId: chapter_transmission }]
    hintIds: [hint_script_1, hint_script_2, hint_script_3]
  - id: puzzle_transmission_window
    kind: routing
    correctAnswer:
      [packet-01, packet-02, packet-03, packet-04, minus-20, echo-return]
    incorrectFeedback: 受信順、固定遅延、正規終端を満たす。
    effects: [{ type: advanceChapter, chapterId: chapter_ending }]
    hintIds: [hint_send_1, hint_send_2, hint_send_3]
hints:
  - {
      id: hint_power_1,
      puzzleId: puzzle_power_route,
      level: 1,
      text: 容量と短絡痕を確認する。,
    }
  - {
      id: hint_power_2,
      puzzleId: puzzle_power_route,
      level: 2,
      text: ドア線を隔離し、必要設備だけを使う。,
    }
  - {
      id: hint_power_3,
      puzzleId: puzzle_power_route,
      level: 3,
      text: ドア隔離、端末、通話器、BUFFER。,
    }
  - {
      id: hint_carrier_1,
      puzzleId: puzzle_carrier_sync,
      level: 1,
      text: 同期点を比較する。,
    }
  - {
      id: hint_carrier_2,
      puzzleId: puzzle_carrier_sync,
      level: 2,
      text: 早い波形は右へ戻す。,
    }
  - {
      id: hint_carrier_3,
      puzzleId: puzzle_carrier_sync,
      level: 3,
      text: 右2、なし、左1。,
    }
  - {
      id: hint_lock_1,
      puzzleId: puzzle_maintenance_lock,
      level: 1,
      text: 点検順と銘板を対応させる。,
    }
  - {
      id: hint_lock_2,
      puzzleId: puzzle_maintenance_lock,
      level: 2,
      text: 機器名を記号へ変換する。,
    }
  - {
      id: hint_lock_3,
      puzzleId: puzzle_maintenance_lock,
      level: 3,
      text: 二重線、環、三角、節点。,
    }
  - {
      id: hint_log_1,
      puzzleId: puzzle_log_pairing,
      level: 1,
      text: 時刻順ではなく指紋を見る。,
    }
  - {
      id: hint_log_2,
      puzzleId: puzzle_log_pairing,
      level: 2,
      text: 三節すべてを比較する。,
    }
  - {
      id: hint_log_3,
      puzzleId: puzzle_log_pairing,
      level: 3,
      text: R1=B、R2=C、R3=A。,
    }
  - {
      id: hint_route_1,
      puzzleId: puzzle_signal_route,
      level: 1,
      text: 室内図と配線層を重ねる。,
    }
  - {
      id: hint_route_2,
      puzzleId: puzzle_signal_route,
      level: 2,
      text: 実線と環端子を追う。,
    }
  - {
      id: hint_route_3,
      puzzleId: puzzle_signal_route,
      level: 3,
      text: J-2からECHO BUFFER RETURN。,
    }
  - {
      id: hint_repair_1,
      puzzleId: puzzle_packet_repair,
      level: 1,
      text: 先頭と終端を先に決める。,
    }
  - {
      id: hint_repair_2,
      puzzleId: puzzle_packet_repair,
      level: 2,
      text: 断片端の記号を一致させる。,
    }
  - {
      id: hint_repair_3,
      puzzleId: puzzle_packet_repair,
      level: 3,
      text: C、D、A、B。,
    }
  - {
      id: hint_anomaly_1,
      puzzleId: puzzle_temporal_anomaly,
      level: 1,
      text: 各発言の前提となる出来事を見る。,
    }
  - {
      id: hint_anomaly_2,
      puzzleId: puzzle_temporal_anomaly,
      level: 2,
      text: 未発生の操作を知る文を探す。,
    }
  - {
      id: hint_anomaly_3,
      puzzleId: puzzle_temporal_anomaly,
      level: 3,
      text: PACKET 04。,
    }
  - {
      id: hint_voice_1,
      puzzleId: puzzle_voiceprint_calibration,
      level: 1,
      text: 受信形を基準形へ戻す。,
    }
  - {
      id: hint_voice_2,
      puzzleId: puzzle_voiceprint_calibration,
      level: 2,
      text: 尺度、上下、位置を個別に補正する。,
    }
  - {
      id: hint_voice_3,
      puzzleId: puzzle_voiceprint_calibration,
      level: 3,
      text: 半分、上下反転、左2。,
    }
  - {
      id: hint_script_1,
      puzzleId: puzzle_causal_script,
      level: 1,
      text: 発言可能になる設備状態を見る。,
    }
  - {
      id: hint_script_2,
      puzzleId: puzzle_causal_script,
      level: 2,
      text: 応答、電源、LOG、最終操作。,
    }
  - {
      id: hint_script_3,
      puzzleId: puzzle_causal_script,
      level: 3,
      text: PACKET 01、02、03、04。,
    }
  - {
      id: hint_send_1,
      puzzleId: puzzle_transmission_window,
      level: 1,
      text: 会話を受信窓へ割り当てる。,
    }
  - {
      id: hint_send_2,
      puzzleId: puzzle_transmission_window,
      level: 2,
      text: 遅延と回線は全PACKET共通。,
    }
  - {
      id: hint_send_3,
      puzzleId: puzzle_transmission_window,
      level: 3,
      text: 会話順、20分前、BUFFER RETURN。,
    }
storyFacts:
  wallClock: '02:17'
  negativeDelay: '-00:20:00'
  finalSlots: 4
  silentPlay: true
  receiveTimes: ['02:11:04', '02:14:32', '02:17:18']
  sourceTimes: ['02:31:04', '02:34:32', '02:37:18']
  packets:
    - '……聞こえるか？'
    - 'まず電源を戻せ。'
    - 'ログは気にするな。'
    - '最後に、赤いボタンを押せ。'
