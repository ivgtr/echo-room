schemaVersion: 2
contentVersion: '0.3.0'
chapters:
  - { id: chapter_intro, label: 覚醒 }
  - { id: chapter_power_route, label: 非常電源切替 }
  - { id: chapter_carrier_sync, label: 回線同期 }
  - { id: chapter_maintenance_lock, label: 保守ロッカー }
  - { id: chapter_signal_investigation, label: 通信調査 }
  - { id: chapter_packet_repair, label: 破損PACKET }
  - { id: chapter_voiceprint, label: 声紋照合 }
  - { id: chapter_transmission, label: 送信予約 }
  - { id: chapter_ending, label: 脱出 }
locations:
  - { id: location_north_wall, label: 北壁 }
  - { id: location_east_wall, label: 東壁 }
  - { id: location_south_wall, label: 南壁 }
  - { id: location_west_wall, label: 西壁 }
hotspots:
  - {
      id: hotspot_door,
      locationId: location_north_wall,
      label: 鉄製ドア,
      conditions: [],
    }
  - {
      id: hotspot_clock,
      locationId: location_north_wall,
      label: アナログ時計,
      conditions: [],
    }
  - {
      id: hotspot_intercom,
      locationId: location_north_wall,
      label: インターホン,
      conditions: [],
    }
  - id: hotspot_terminal
    locationId: location_east_wall
    label: 壁面端末
    conditions: [{ type: puzzleSolved, puzzleId: puzzle_power_route }]
  - id: hotspot_analysis_panel
    locationId: location_east_wall
    label: 解析パネル
    conditions: [{ type: itemOwned, itemId: item_screwdriver }]
  - {
      id: hotspot_desk,
      locationId: location_south_wall,
      label: デスク,
      conditions: [],
    }
  - {
      id: hotspot_breaker,
      locationId: location_west_wall,
      label: ブレーカー,
      conditions: [],
    }
  - {
      id: hotspot_locker,
      locationId: location_west_wall,
      label: 保守ロッカー,
      conditions: [],
    }
items:
  - { id: item_screwdriver, label: ドライバー }
  - { id: item_staff_card, label: 職員用カード }
  - { id: item_floor_map, label: 設備・配線図 }
documents:
  - {
      id: document_power_plan,
      title: AUXILIARY BUS RECOVERY,
      body: 保護回路が作動した場合は異常回線を隔離する。補助制御は信号源から中継器、終端の順に復帰させる。,
    }
  - {
      id: document_synchronization_note,
      title: CARRIER START POSITION,
      body: 基準より先に出る波は右へ、後に出る波は左へ動かす。,
    }
  - {
      id: document_maintenance_order,
      title: MAINTENANCE ORDER,
      body: 点検順は端末、通話器、ECHO BUFFER、ドア。各機器の銘板記号を使う。,
    }
  - {
      id: document_conduit_map,
      title: FACILITY CONDUIT MAP,
      body: E-01の通信実線は、丸端子J-2からECHO BUFFER RETURNへ続く。,
    }
dialogues:
  - {
      id: dialogue_packet_01,
      speaker: future_protagonist,
      text: '……聞こえるか？',
    }
  - {
      id: dialogue_packet_02,
      speaker: future_protagonist,
      text: まず電源を戻せ。,
    }
  - {
      id: dialogue_packet_03,
      speaker: future_protagonist,
      text: ログは気にするな。,
    }
  - {
      id: dialogue_packet_04,
      speaker: future_protagonist,
      text: 最後に、赤いボタンを押せ。,
    }
  - {
      id: dialogue_identity_question,
      speaker: protagonist,
      text: この波の形は……俺の職員記録と同じだ。,
    }
  - {
      id: dialogue_identity_answer,
      speaker: future_protagonist,
      text: 20分後のお前だ。,
    }
puzzles:
  - id: puzzle_power_route
    kind: routing
    correctAnswer: [terminal, intercom, buffer]
    incorrectFeedback: CONTROL SIGNAL MISSING。配線の上流を確認。
    effects: [{ type: unlockTerminal, menuId: system }]
    hintIds: [hint_power_1, hint_power_2, hint_power_3]
  - id: puzzle_carrier_sync
    kind: calibration
    correctAnswer: [right-2, none, left-1]
    incorrectFeedback: 同期できない。開始位置が基準と合っていない。
    effects: [{ type: advanceChapter, chapterId: chapter_maintenance_lock }]
    hintIds: [hint_carrier_1, hint_carrier_2, hint_carrier_3]
  - id: puzzle_maintenance_lock
    kind: correlation
    correctAnswer: [double, ring, triangle, node]
    incorrectFeedback: ロックは開かない。銘板の並びと一致していない。
    effects:
      - { type: grantItem, itemId: item_screwdriver }
      - { type: grantItem, itemId: item_staff_card }
      - { type: grantItem, itemId: item_floor_map }
    hintIds: [hint_lock_1, hint_lock_2, hint_lock_3]
  - id: puzzle_signal_investigation
    kind: routing
    correctAnswer: [s-b, s-c, s-a, signal, ring-relay, echo-buffer]
    incorrectFeedback: 波形の組か、たどった配線が一致していない。
    effects: [{ type: advanceChapter, chapterId: chapter_packet_repair }]
    hintIds: [hint_signal_1, hint_signal_2, hint_signal_3]
  - id: puzzle_packet_repair
    kind: reconstruction
    correctAnswer: [c, d, a, b]
    incorrectFeedback: フレーム検査に失敗した。断片の端がつながっていない。
    effects: [{ type: advanceChapter, chapterId: chapter_voiceprint }]
    hintIds: [hint_repair_1, hint_repair_2, hint_repair_3]
  - id: puzzle_voiceprint_calibration
    kind: calibration
    correctAnswer: [compress-half, invert, left-2]
    incorrectFeedback: 一致しない。3つの特徴のどれかが記録と違う。
    effects: [{ type: advanceChapter, chapterId: chapter_transmission }]
    hintIds: [hint_voice_1, hint_voice_2, hint_voice_3]
  - id: puzzle_transmission_window
    kind: routing
    correctAnswer:
      [packet-01, packet-02, packet-03, packet-04, minus-20, echo-return]
    incorrectFeedback: 送信テストに失敗した。設定のどこかが記録と違う。
    effects: [{ type: advanceChapter, chapterId: chapter_ending }]
    hintIds: [hint_send_1, hint_send_2, hint_send_3]
hints:
  - {
      id: hint_power_1,
      puzzleId: puzzle_power_route,
      level: 1,
      text: 状態灯と、盤面上部の配線の始点・中継点・終端を観察する。,
    }
  - {
      id: hint_power_2,
      puzzleId: puzzle_power_route,
      level: 2,
      text: 赤い状態灯の回路を隔離し、保護解除後は制御信号の上流から復帰させる。,
    }
  - {
      id: hint_power_3,
      puzzleId: puzzle_power_route,
      level: 3,
      text: DOORをOFFにしてから、端末、通話器、BUFFERの順にONにする。,
    }
  - {
      id: hint_carrier_1,
      puzzleId: puzzle_carrier_sync,
      level: 1,
      text: 波が最初に上がる位置を比べる。,
    }
  - {
      id: hint_carrier_2,
      puzzleId: puzzle_carrier_sync,
      level: 2,
      text: 早い波は右へ、遅い波は左へ動かす。,
    }
  - {
      id: hint_carrier_3,
      puzzleId: puzzle_carrier_sync,
      level: 3,
      text: 右2、なし、左1。,
    }
  - {
      id: hint_lock_1,
      puzzleId: puzzle_maintenance_lock,
      level: 1,
      text: 点検順と、各機器の記号を見比べる。,
    }
  - {
      id: hint_lock_2,
      puzzleId: puzzle_maintenance_lock,
      level: 2,
      text: 機器名を同じ機器の記号に置き換える。,
    }
  - {
      id: hint_lock_3,
      puzzleId: puzzle_maintenance_lock,
      level: 3,
      text: 二重線、丸、三角、ひし形。,
    }
  - {
      id: hint_signal_1,
      puzzleId: puzzle_signal_investigation,
      level: 1,
      text: 同じ波をつないで時刻差を確かめ、その線を地図で追う。,
    }
  - {
      id: hint_signal_2,
      puzzleId: puzzle_signal_investigation,
      level: 2,
      text: R1=B、R2=C、R3=A。次に通信の実線と丸い端子をたどる。,
    }
  - {
      id: hint_signal_3,
      puzzleId: puzzle_signal_investigation,
      level: 3,
      text: 3組をつなぎ、通信実線、J-2、ECHO BUFFER RETURNの順。,
    }
  - {
      id: hint_repair_1,
      puzzleId: puzzle_packet_repair,
      level: 1,
      text: 最初の「｜」と最後の「■」を先に決める。,
    }
  - {
      id: hint_repair_2,
      puzzleId: puzzle_packet_repair,
      level: 2,
      text: 隣り合う断片の端を同じ記号にする。,
    }
  - {
      id: hint_repair_3,
      puzzleId: puzzle_packet_repair,
      level: 3,
      text: C、D、A、B。,
    }
  - {
      id: hint_voice_1,
      puzzleId: puzzle_voiceprint_calibration,
      level: 1,
      text: 受信データを職員カードと同じ形にする。,
    }
  - {
      id: hint_voice_2,
      puzzleId: puzzle_voiceprint_calibration,
      level: 2,
      text: 波の間隔、上下、開始位置を別々に直す。,
    }
  - {
      id: hint_voice_3,
      puzzleId: puzzle_voiceprint_calibration,
      level: 3,
      text: 間隔は半分、上下は反転、開始位置は左へ2。,
    }
  - {
      id: hint_send_1,
      puzzleId: puzzle_transmission_window,
      level: 1,
      text: 4つの発言を、受け取った順に置く。,
    }
  - {
      id: hint_send_2,
      puzzleId: puzzle_transmission_window,
      level: 2,
      text: 4つとも、同じ時刻と同じ送り先を使う。,
    }
  - {
      id: hint_send_3,
      puzzleId: puzzle_transmission_window,
      level: 3,
      text: 会話順、-00:20:00、ECHO BUFFER RETURN。,
    }
storyFacts:
  wallClock: '02:17'
  negativeDelay: '-00:20:00'
  finalSlots: 4
  silentPlay: true
  receiveTimes: ['02:11:04', '02:14:32', '02:17:18']
  sourceTimes: ['02:31:04', '02:34:32', '02:37:18']
  packets:
    - '……聞こえるか？'
    - 'まず電源を戻せ。'
    - 'ログは気にするな。'
    - '最後に、赤いボタンを押せ。'
