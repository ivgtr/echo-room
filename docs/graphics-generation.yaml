post_generation_validation:
  automated:
    - Every declared reference ID exists.
    - Every required asset has all declared deliverables.
    - Raster dimensions meet or exceed the declared runtime dimensions.
    - Alpha assets contain an alpha channel.
    - Full-screen layers share identical dimensions and origin.
    - Runtime file names follow the asset naming convention.
  visual:
    - Four wide views agree with canonical_space.
    - No window or adjacent-room opening exists.
    - Close-ups match their parent wide-view object.
    - State variants preserve unchanged pixels and camera.
    - Generated text, watermark and accidental UI have been removed.
    - Emergency state remains navigable.
    - Subtitle and crop-safe regions remain clear.
    - Promotional assets contain no identity reveal spoiler.
  story_accuracy:
    - Clock overlay reads exactly 02:17.
    - Locker solution overlay can display exactly 0237.
    - Terminal can display receive/source times with exactly 20 minutes difference.
    - Facility map shows no room adjacent to E-01.
    - Final transmission control has exactly four packet slots and one red button.

