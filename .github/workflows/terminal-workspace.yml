name: Terminal verification workspace

on:
  push:
    branches: [codex/issue-13-terminal-instrument]
    paths: [.github/workflows/terminal-workspace.yml]

permissions:
  contents: write

concurrency:
  group: echo-room-terminal-13
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/issue-13-terminal-instrument
      - name: Apply the exact locally checked changes
        run: |
          test "$GITHUB_REF" = refs/heads/codex/issue-13-terminal-instrument
          mkdir -p tmp
          for patch in .github/terminal-patches/*.patch; do
            git apply --check "$patch"
            git apply --index "$patch"
          done
          sha256sum --check .github/terminal-checksums.txt
          cp .github/terminal-checksums.txt tmp/terminal-checksums.txt
          git diff --cached --check
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types, style, content, assets, unit tests and build
        run: npm run check 2>&1 | tee tmp/terminal-check.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise all browser routes without retries
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tmp/terminal-e2e-results.json
          PLAYWRIGHT_HTML_REPORT: tmp/terminal-playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --retries=0 --workers=2 --max-failures=3 --reporter=line,json,html --output=tmp/terminal-test-results 2>&1 | tee tmp/terminal-e2e.log
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-review-evidence
          path: |
            tmp/terminal-check.log
            tmp/terminal-checksums.txt
            tmp/terminal-e2e.log
            tmp/terminal-e2e-results.json
            tmp/terminal-playwright-report
            tmp/terminal-test-results
          retention-days: 7
      - name: Commit only verified code to the work branch
        if: success()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { stats } = JSON.parse(fs.readFileSync('tmp/terminal-e2e-results.json', 'utf8'));
          if (stats.expected !== 24 || stats.unexpected || stats.flaky || stats.skipped) throw new Error('Incomplete browser verification');
          const path = 'docs/decisions/terminal-instrument.md';
          const text = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(path, text.replace('実ブラウザ検証: 実施待ち。PR作成前に結果を更新する。', `指定のNode ${process.version}でnpm run check成功。Chromiumの全E2E ${stats.expected}件が再試行なしで成功した。キーボード通しプレイ、表示切替時の状態とfocus、チェックポイント再開、844×390・568×320でのタッチ、無音・動き軽減、送信インターロックを含む。画面キャプチャとレポートをレビュー用artifactへ収集した。`));
          JS
          git add docs/decisions/terminal-instrument.md
          git rm -r .github/terminal-patches .github/terminal-checksums.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(terminal): integrate verified instrument UI and observed records'
          git push origin HEAD:refs/heads/codex/issue-13-terminal-instrument
