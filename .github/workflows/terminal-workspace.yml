name: Terminal verification workspace

on:
  push:
    branches: [codex/issue-13-terminal-instrument]
    paths: [.github/workflows/terminal-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Archive tracked source and test dependencies
        run: |
          mkdir -p tmp
          git archive --format=tar --output=tmp/source.tar HEAD
          tar -czf tmp/dependencies.tar.gz node_modules
      - name: Upload temporary verification workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-verification-workspace
          path: |
            tmp/source.tar
            tmp/dependencies.tar.gz
          retention-days: 1
      - name: Baseline checks
        run: npm run check
